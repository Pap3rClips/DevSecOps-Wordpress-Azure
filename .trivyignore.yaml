# vulnerabilities:
#   - id: CVE-2026-00000
#     statement: >-
#       Composant présent dans l'image de base mais jamais chargé par Apache/PHP.
#       Pas de correctif amont à ce jour. Revue le 2026-11-15.
#     expired_at: 2026-11-15

