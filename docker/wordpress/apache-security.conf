# Ne pas divulguer la version d'Apache ni de l'OS
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<Directory /var/www/html>
    Options -Indexes -Includes
</Directory>

# Fichiers qui n'ont rien à faire côté client
<FilesMatch "^(wp-config\.php|\.htaccess|\.user\.ini|xmlrpc\.php|.*\.(sql|bak|log|swp|orig|dist))$">
    Require all denied
</FilesMatch>

# Aucune exécution de PHP dans le répertoire d'uploads
<Directory /var/www/html/wp-content/uploads>
    <FilesMatch "\.(php|phtml|phar)$">
        Require all denied
    </FilesMatch>
</Directory>
