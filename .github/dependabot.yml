# Mises à jour automatiques proposées en PR : elles passent par les mêmes
# contrôles bloquants que tout autre changement.
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /docker/wordpress
    schedule:
      interval: weekly

  # Un seul PR pour tous les dossiers Terraform : les contraintes de version
  # du module et des environnements doivent évoluer ensemble, sinon chaque PR
  # isolé est incohérent (module en 4.x, environnement en 5.x) et échoue.
  - package-ecosystem: terraform
    directories: ["/terraform/bootstrap", "/terraform/environments/*", "/terraform/modules/*"]
    schedule:
      interval: weekly
    groups:
      terraform-providers:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
